# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 说明：不要在工程里写死 aapt2 路径。Windows / Android Studio 使用 AGP 自带的
# aapt2；在 arm64 Android 设备（Termux/proot）本机构建时，用以下任一方式覆盖：
#   1) 命令行：-Pandroid.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
#   2) 或写入该设备专属的 ~/.gradle/gradle.properties
# 这样工程复制到其他机器时不会因路径不存在而构建失败。

# This project uses the platform android.widget widgets, not AndroidX.
# android.useAndroidX is deprecated and defaults to true; leave it unset.
android.nonTransitiveRClass=true

# Debug is debuggable and not minified; Release enables R8. The warning
# suppression below is kept only for the AGP project-option warning.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
